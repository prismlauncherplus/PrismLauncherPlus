name: Publish

on:
  release:
    types: [ released ]

permissions: {}

jobs:
  winget:
    name: Winget

    permissions:
      contents: read

    # TODO(PrismLauncherPlus): Prism Launcher Plus has no winget package yet. Disabled until one is submitted
    # and the WINGET_TOKEN secret is set; then set the ENABLE_WINGET_PUBLISH repository variable to 'true'.
    if: github.repository == 'prismlauncherplus/PrismLauncherPlus' && vars.ENABLE_WINGET_PUBLISH == 'true'

    runs-on: ubuntu-slim

    steps:
      - name: Publish on Winget
        # @Octol1ttle: Pinned to a commit because no release has been published that works on ubuntu-slim
        uses: vedantmgoyal2009/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5 # docs: add description to inputs (#335)
        with:
          identifier: PrismLauncherPlus.PrismLauncherPlus
          version: ${{ github.event.release.tag_name }}
          installers-regex: 'PrismLauncherPlus-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
